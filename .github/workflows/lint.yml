name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-main' || (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && 'ci-approval' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.16.10
      - name: Lint
        run: ruff check --output-format=github .
      - name: Compile with the oldest supported Python syntax
        run: python -m compileall -q warm_compaction scripts tests
