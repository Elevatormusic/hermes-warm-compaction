version: 2
updates:
  # The plugin has no runtime dependency. Update CI actions and test tools.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["*"]
