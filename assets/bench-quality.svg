<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="What the agent still knows after compaction" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547"/><stop offset="0.6" stop-color="#FF6B3D"/><stop offset="1" stop-color="#E03A5A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="530" rx="24" fill="#101218"/>
  <rect x="0.5" y="0.5" width="1199" height="529" rx="23.5" fill="none" stroke="#262A33"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#F7F4EF">What the agent still knows after compaction</text>
  <text x="40" y="82" font-size="15" fill="#A9A39A">Same 10 sessions. One probe after one automatic compaction. Higher is better.</text>
  <text x="40" y="124" font-size="17" font-weight="700" fill="#EDE8E0">Compacted facts kept (6 per session)</text>
  <text x="244" y="156" font-size="15" text-anchor="end" fill="#CFC8BD">warm_compaction</text>
  <rect x="260" y="138" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="138" width="629.3" height="26" rx="6" fill="url(#warm)"/>
  <text x="899.3" y="156" font-size="15" font-weight="700" fill="#F7F4EF">59/60</text>
  <text x="244" y="190" font-size="15" text-anchor="end" fill="#CFC8BD">hermes-lcm</text>
  <rect x="260" y="172" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="172" width="458.7" height="26" rx="6" fill="#8EA4C8"/>
  <text x="728.7" y="190" font-size="15" font-weight="400" fill="#F7F4EF">43/60</text>
  <text x="244" y="224" font-size="15" text-anchor="end" fill="#CFC8BD">built-in</text>
  <rect x="260" y="206" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="206" width="533.3" height="26" rx="6" fill="#5E6878"/>
  <text x="803.3" y="224" font-size="15" font-weight="400" fill="#F7F4EF">50/60</text>
  <text x="40" y="262" font-size="17" font-weight="700" fill="#EDE8E0">Fact in the middle of a long message</text>
  <text x="244" y="294" font-size="15" text-anchor="end" fill="#CFC8BD">warm_compaction</text>
  <rect x="260" y="276" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="276" width="640.0" height="26" rx="6" fill="url(#warm)"/>
  <text x="910.0" y="294" font-size="15" font-weight="700" fill="#F7F4EF">10/10</text>
  <text x="244" y="328" font-size="15" text-anchor="end" fill="#CFC8BD">hermes-lcm</text>
  <rect x="260" y="310" width="640" height="26" rx="6" fill="#181B22"/>
  <text x="270.0" y="328" font-size="15" font-weight="400" fill="#F7F4EF">0/10</text>
  <text x="244" y="362" font-size="15" text-anchor="end" fill="#CFC8BD">built-in</text>
  <rect x="260" y="344" width="640" height="26" rx="6" fill="#181B22"/>
  <text x="270.0" y="362" font-size="15" font-weight="400" fill="#F7F4EF">0/10</text>
  <text x="40" y="400" font-size="17" font-weight="700" fill="#EDE8E0">Standing rule kept in the next reply</text>
  <text x="244" y="432" font-size="15" text-anchor="end" fill="#CFC8BD">warm_compaction</text>
  <rect x="260" y="414" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="414" width="640.0" height="26" rx="6" fill="url(#warm)"/>
  <text x="910.0" y="432" font-size="15" font-weight="700" fill="#F7F4EF">10/10</text>
  <text x="244" y="466" font-size="15" text-anchor="end" fill="#CFC8BD">hermes-lcm</text>
  <rect x="260" y="448" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="448" width="320.0" height="26" rx="6" fill="#8EA4C8"/>
  <text x="590.0" y="466" font-size="15" font-weight="400" fill="#F7F4EF">5/10</text>
  <text x="244" y="500" font-size="15" text-anchor="end" fill="#CFC8BD">built-in</text>
  <rect x="260" y="482" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="482" width="384.0" height="26" rx="6" fill="#5E6878"/>
  <text x="654.0" y="500" font-size="15" font-weight="400" fill="#F7F4EF">6/10</text>
</svg>
