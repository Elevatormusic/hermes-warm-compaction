name: Feature request
description: Propose a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI agent use
      description: If an AI agent helped diagnose the problem or write code, list every harness, exact model, and task. A harness is the app or tool that ran the agent. Otherwise write exactly No AI agent used. Do not include private paths, configs, credentials, or conversations.
      placeholder: |
        Harness:
        Model:
        Work:
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that the plugin does not do now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could the plugin do it? The plugin uses documented Hermes plugin APIs only.
  - type: textarea
    id: context
    attributes:
      label: Server and setup
      description: The server, model, and API mode where you need it, if it matters.
