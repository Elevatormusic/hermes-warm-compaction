name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue-policy:
    name: Issue policy unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Test the policy with fake API data
        run: python -B -m unittest discover -s tests -p "test_issue_policy.py" -v

  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Unit tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -p "test_wc_*.py" -v
      - name: Property tests with branch coverage
        if: ${{ !cancelled() }}
        run: python -m coverage run --append -m unittest discover -s tests/property -p "test_*.py" -v
      - name: Report branch coverage
        if: always()
        run: |
          python -c "from pathlib import Path; Path('.work').mkdir(exist_ok=True)"
          python -m coverage report -m
          python -m coverage xml -o .work/coverage.xml
          python -m coverage json -o .work/coverage.json
      - name: Save branch coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            .work/coverage.xml
            .work/coverage.json
          if-no-files-found: warn
          retention-days: 14

  # One stable check name for branch protection: it passes only when every unit job passed.
  tests-passed:
    if: always()
    needs: [unit, issue-policy]
    runs-on: ubuntu-latest
    steps:
      - name: All unit jobs passed
        run: test "${{ needs.unit.result }}" = "success" && test "${{ needs.issue-policy.result }}" = "success"
