<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Compaction speed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547"/><stop offset="0.6" stop-color="#FF6B3D"/><stop offset="1" stop-color="#E03A5A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#101218"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#262A33"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#F7F4EF">Compaction speed</text>
  <text x="40" y="82" font-size="15" fill="#A9A39A">DGX, automatic compaction, 10 synthetic sessions of about 105K tokens. Median seconds, lower is better.</text>
  <text x="40" y="124" font-size="17" font-weight="700" fill="#EDE8E0">Compaction</text>
  <text x="1160" y="124" font-size="14" text-anchor="end" fill="#FF9A5C">median 2.6× lower than hermes-lcm, 4.7× lower than built-in</text>
  <text x="244" y="156" font-size="15" text-anchor="end" fill="#CFC8BD">warm_compaction</text>
  <rect x="260" y="138" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="138" width="107.4" height="26" rx="6" fill="url(#warm)"/>
  <text x="377.4" y="156" font-size="15" font-weight="700" fill="#F7F4EF">16.8 s</text>
  <text x="244" y="190" font-size="15" text-anchor="end" fill="#CFC8BD">hermes-lcm</text>
  <rect x="260" y="172" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="172" width="278.4" height="26" rx="6" fill="#8EA4C8"/>
  <text x="548.4" y="190" font-size="15" font-weight="400" fill="#F7F4EF">43.5 s</text>
  <text x="244" y="224" font-size="15" text-anchor="end" fill="#CFC8BD">built-in</text>
  <rect x="260" y="206" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="206" width="502.1" height="26" rx="6" fill="#5E6878"/>
  <text x="772.1" y="224" font-size="15" font-weight="400" fill="#F7F4EF">78.5 s</text>
  <text x="40" y="268" font-size="17" font-weight="700" fill="#EDE8E0">Compaction + next reply</text>
  <text x="1160" y="268" font-size="14" text-anchor="end" fill="#FF9A5C">median 2.4× lower than hermes-lcm, 3.5× lower than built-in</text>
  <text x="244" y="300" font-size="15" text-anchor="end" fill="#CFC8BD">warm_compaction</text>
  <rect x="260" y="282" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="282" width="178.6" height="26" rx="6" fill="url(#warm)"/>
  <text x="448.6" y="300" font-size="15" font-weight="700" fill="#F7F4EF">27.9 s</text>
  <text x="244" y="334" font-size="15" text-anchor="end" fill="#CFC8BD">hermes-lcm</text>
  <rect x="260" y="316" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="316" width="422.7" height="26" rx="6" fill="#8EA4C8"/>
  <text x="692.7" y="334" font-size="15" font-weight="400" fill="#F7F4EF">66.1 s</text>
  <text x="244" y="368" font-size="15" text-anchor="end" fill="#CFC8BD">built-in</text>
  <rect x="260" y="350" width="640" height="26" rx="6" fill="#181B22"/>
  <rect x="260" y="350" width="621.6" height="26" rx="6" fill="#5E6878"/>
  <text x="891.6" y="368" font-size="15" font-weight="400" fill="#F7F4EF">97.1 s</text>
</svg>
