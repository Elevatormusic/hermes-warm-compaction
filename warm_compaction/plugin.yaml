manifest_version: 2
name: warm_compaction
version: 0.2.0
description: "Context engine: the main model writes the compaction handoff on the cached request prefix. Fallback summary when that is not possible."
kind: standalone
author: Elevatormusic
homepage: https://github.com/Elevatormusic/hermes-warm-compaction
tags: [context-engine, compaction]
provides_hooks:
  - pre_api_request
  - post_api_request
  - on_session_finalize
  - on_session_reset
  - pre_auxiliary_call
  - post_auxiliary_call
  - pre_auxiliary_native_request
  - post_auxiliary_native_request
config_schema:
  threshold:
    type: float
    default: 0.5
    description: Fraction of the context window at which automatic compaction starts (0.10 to 0.95).
  tail_tokens:
    type: int
    default: 0
    description: Size of the verbatim tail in tokens. 0 means 2.5% of the context window, from 10000 to 25000.
  user_copy_chars:
    type: int
    default: 24000
    description: Total characters of copied user messages in the summary.
  warm:
    type: bool
    default: true
    description: Use the warm request. Set false for comparison runs.
  moa_routes:
    type: list
    default: []
    description: Explicit replay destinations for MOA Chat Completions or native Codex calls. See the MOA guide for route fields.
  moa_references:
    type: bool
    default: false
    description: Ask captured MOA references for advisory handoffs before the aggregator handoff.
